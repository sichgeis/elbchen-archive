<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- `sizes="any"` is to fix Chrome bug -->
    <link rel="icon" href="./src/assets/favicon.ico" sizes="any" />
    <link rel="icon" href="./src/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
    <link rel="manifest" href="./src/assets/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Förderwerk Projektarchiv</title>

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Förderwerk Projektarchiv"
    />
    <meta
      name="description"
      content="Das Archiv von Förderwerk und Stiftungskartei: digitale Werkzeuge, offener Quellcode und Erfahrungen aus der Fördermittelarbeit mit gemeinnützigen Organisationen."
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://foerderwerk.org/"
    />
    <meta
      property="og:title"
      content="Förderwerk Projektarchiv"
    />
    <meta
      property="og:description"
      content="Wie wir Fördermittelarbeit einfacher machen wollten – und was von Förderwerk und Stiftungskartei bleibt."
    />
    <meta
      property="og:image"
      content="https://foerderwerk.org/og.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:url"
      content="https://foerderwerk.org/"
    />
    <meta
      name="twitter:title"
      content="Förderwerk Projektarchiv"
    />
    <meta
      name="twitter:description"
      content="Wie wir Fördermittelarbeit einfacher machen wollten – und was von Förderwerk und Stiftungskartei bleibt."
    />
    <meta
      name="twitter:image"
      content="https://foerderwerk.org/og.png"
    />
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
