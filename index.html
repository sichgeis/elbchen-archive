<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />

      name="viewport"

    <title>Förderwerk Projektarchiv</title>

      content="Förderwerk Projektarchiv"
    />

      property="og:description"

      property="og:image"

    <meta property="og:image:width" content="1200" />
